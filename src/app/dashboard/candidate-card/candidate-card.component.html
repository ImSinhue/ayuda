<div
  (click)="open()"
  class="cursor-pointer rounded-xl p-4 shadow-md transition-transform transform hover:scale-105"
  [ngClass]="candidate.color"
>
  <div class="flex items-center space-x-4">
    <img [src]="candidate.avatar" class="w-12 h-12 rounded-full" />
    <div>
      <h3 class="text-lg font-semibold">{{ candidate.name }}</h3>
      <p class="text-sm text-gray-600">{{ candidate.email }}</p>
      <p class="text-sm">{{ candidate.network }} - {{ candidate.metric }}</p>
    </div>
  </div>
</div>
