<div class="flex items-center justify-center min-h-screen bg-gradient-to-r from-teal-400 to-coral-400 p-4">
  <form (ngSubmit)="onSubmit()" class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md animate-fadeIn">
    <h2 class="text-3xl font-semibold text-center mb-6 text-teal-600">Iniciar Sesión</h2>

    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-2" for="username">Usuario</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        name="username"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-teal-400 transition"
      />
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 font-medium mb-2" for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-teal-400 transition"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 rounded transition duration-300"
      [disabled]="loading"
    >
      {{ loading ? 'Validando...' : 'Entrar' }}
    </button>

    <p *ngIf="errorMessage" class="mt-4 text-red-600 text-center font-medium">{{ errorMessage }}</p>
  </form>
</div>
